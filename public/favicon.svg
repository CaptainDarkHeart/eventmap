<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    #pin { transform-origin: 32px 30px; animation: spin 6s linear infinite; }
    @keyframes spin {
      0%   { transform: scaleX(1); }
      25%  { transform: scaleX(0.05); }
      50%  { transform: scaleX(-1); }
      75%  { transform: scaleX(0.05); }
      100% { transform: scaleX(1); }
    }
    #pin path { fill: #e00000; }
    #pin circle { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      #pin path { fill: #ff2b2b; }
    }
    @media (prefers-reduced-motion: reduce) {
      #pin { animation: none; }
    }
    #shadow { fill: #000; opacity: 0.3; }
  </style>
  <ellipse id="shadow" cx="32" cy="60" rx="11" ry="3"/>
  <g id="pin">
    <path d="M32 4C20 4 11 13.3 11 25c0 16 21 35 21 35s21-19 21-35C53 13.3 44 4 32 4Z"/>
    <circle cx="32" cy="24.5" r="8.5"/>
  </g>
</svg>
