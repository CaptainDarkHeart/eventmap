name: Cloud egress test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch discovery sources
        run: |
          for u in https://dev.events https://confs.tech https://www.techmeme.com/events https://tech.eu https://dealroom.co https://www.startupevents.org https://api.anthropic.com https://nominatim.openstreetmap.org; do
            printf '%s ' "$u"; curl -s -o /dev/null -L -m 15 -A "Mozilla/5.0" -w '%{http_code}\n' "$u" || echo fail
          done
      - name: Claude Code available?
        run: npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
