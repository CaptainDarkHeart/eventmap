name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "wrangler.jsonc"
      - "package*.json"
      - "astro.config.mjs"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CARTO_KEY: ${{ secrets.PUBLIC_CARTO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate-events
      - run: npm test
      # Prune in the runner only, same as `npm run deploy`. Not committed back.
      - run: node scripts/prune-past-events.mjs
      - run: npx astro build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
